# Extract audio
--ignore-errors
--no-abort-on-error
--extract-audio
--audio-format mp3
--audio-quality 0

# Best audio format available
--format bestaudio

# Embed metadata and artwork
--embed-thumbnail
--embed-metadata
--add-metadata

# Prevent duplicate downloads
--download-archive archive.txt

# Prioritize newest items
--playlist-reverse

# Limit number of tracks per playlist/source
--playlist-end 5

# Keep tracks 10 minutes or shorter
# Skip obvious radio / podcast / set-type titles
--match-filters "duration <= 600 & title!~='(?i)(radio|podcast|episode|live set|dj set|full set|guest mix|recorded live|closing set|opening set|boiler room)'"

# Organize by artist folder, with fallback fields for better reliability
-o "C:/Music/SoundCloud/%(artist,creator,uploader)s/%(artist,creator,uploader)s - %(title)s.%(ext)s"
