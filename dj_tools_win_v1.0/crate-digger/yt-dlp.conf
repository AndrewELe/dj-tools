# Extract audio
--ignore-errors
--no-abort-on-error
--extract-audio
--audio-format mp3
--audio-quality 0

# Best audio format available
--format bestaudio

# Embed metadata and artwork
--embed-thumbnail
--embed-metadata
--add-metadata

# Avoid SoundCloud throttling on large runs (700+ tracks).
# Sleep before every track download (randomized 5-10s so the cadence
# doesn't look robotic), plus a short pause between metadata/API requests.
--sleep-interval 5
--max-sleep-interval 10
--sleep-requests 1.5

# Prevent duplicate downloads
--download-archive archive.txt

# Prioritize newest items
--playlist-reverse

# Keep tracks 13 minutes or shorter
# Skip obvious radio / podcast / set-type titles
--match-filters "duration <= 780 & title!~='(?i)(radio|podcast|episode|live set|dj set|full set|guest mix|recorded live|closing set|opening set|boiler room)'"

# Output path is supplied by digcrate.bat so the script can verify and create the download root first.
